name: "Pipeline checks"
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: "Install FFmpeg (Linux)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: "Install FFmpeg (macOS)"
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: "Install FFmpeg (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r scripts/requirements-ocr.txt
      - run: python scripts/test_pipeline.py
      - run: python scripts/test_public.py
      - run: python scripts/test_hud_prefilter.py
      - run: python apex.py doctor
      - run: python apex.py package --output dist/apex-clipper-source.zip
