name: "Pipeline checks"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      APEX_NO_VENV: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: "Install FFmpeg (Linux)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: "Install FFmpeg (macOS)"
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: "Install FFmpeg (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r scripts/requirements-ocr.txt
      - name: Run all regression and generated-media tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python apex.py doctor
      - run: python apex.py package --output dist/apex-clipper-source.zip
